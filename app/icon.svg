<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- CodeBounty: a bug as the bounty — angle-bracket diff frame, capsule body, paid sweep -->
  <!-- amber-soft highlighter under the locked dollar -->
  <rect x="24" y="13" width="16" height="9" rx="2.5" fill="#f2c879" transform="rotate(-7 32 17)"/>
  <!-- legs of the bug, splayed from the body -->
  <g stroke="#25201a" stroke-width="3.6" stroke-linecap="round">
    <path d="M24 33 l-9 -5"/>
    <path d="M24 40 l-10 1"/>
    <path d="M24 47 l-9 6"/>
    <path d="M40 33 l9 -5"/>
    <path d="M40 40 l10 1"/>
    <path d="M40 47 l9 6"/>
  </g>
  <!-- diff brackets: a "<" before and ">" after the body -->
  <path d="M19 25 l-7 6 l7 6" fill="none" stroke="#e0922f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 25 l7 6 l-7 6" fill="none" stroke="#e0922f" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the bug / bounty capsule -->
  <rect x="24" y="22" width="16" height="28" rx="8" fill="#25201a"/>
  <!-- accepted-fix check, paid green -->
  <path d="M27.5 37 l3.6 4 l6 -8" fill="none" stroke="#bfe6b0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
